<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search &mdash; Search Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="app.css?v=23">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/n3@1.22.3/browser/n3.min.js"></script>
  <script src="wkt.js?v=1"></script>
  <script src="app-config.js?v=4"></script>
  <script src="labels.js?v=1"></script>
  <script src="app.js?v=34"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('app', { showLog: true, showMap: true, highlightUri: null });
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>
  <nav class="site-navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <span class="brand-icon">&#9670;</span>
      <a class="brand-name" href="index.html">Search Tester</a>
      <span class="version-badge">v6.1</span>
      <button class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="mainNav">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
    <div id="mainNav" class="navbar-tabs">
      <a class="nav-tab is-tab-active" href="index.html">Search</a>
      <a class="nav-tab" href="config.html">Configuration</a>
      <a class="nav-tab" href="stats.html">Stats</a>
    </div>
    <div class="navbar-end" x-data>
      <label class="navbar-toggle">
        <input type="checkbox" :checked="$store.app.showMap" @change="$store.app.showMap = !$store.app.showMap">
        <span>Map</span>
      </label>
      <label class="navbar-toggle">
        <input type="checkbox" :checked="$store.app.showLog" @change="$store.app.showLog = !$store.app.showLog">
        <span>Log</span>
      </label>
    </div>
  </nav>

  <section class="section">
    <div class="container is-fluid main-content" x-data="searchApp()" x-cloak
         @keydown.escape.window="closeTopPopup()">

      <div class="loading-bar" :class="{ 'is-loading': showLoading }"></div>

      <template x-if="error">
        <div class="notice-error" x-text="error"></div>
      </template>

      <div class="columns mb-0" x-show="!error">
        <div class="column left-panel"></div>
        <div class="column">
          <p class="results-description" x-html="description"></p>
        </div>
        <div class="column right-panel" x-show="$store.app.showMap || $store.app.showLog">
          <p class="results-description" x-show="$store.app.showMap"
             x-text="mapMarkerCount + ' of ' + cards.length + ' results mapped'"></p>
        </div>
      </div>

      <div class="columns search-layout">

        <!-- Sidebar: search + facets -->
        <div class="column left-panel">
          <div class="facet-sidebar">
            <template x-if="exampleGroups.length > 0">
              <div class="sidebar-panel examples-panel">
                <button class="examples-toggle" type="button" @click="examplesOpen = !examplesOpen">
                  <span class="examples-caret" x-text="examplesOpen ? '▾' : '▸'"></span>
                  <span class="sidebar-header examples-title">Examples</span>
                  <span class="example-group-count" x-text="exampleCount()"></span>
                </button>

                <div class="examples-body" x-show="examplesOpen" x-cloak>
                  <p class="examples-help">Load a saved search into the filters below.</p>
                  <template x-for="group in exampleGroups" :key="group.name">
                    <section class="example-group">
                      <button class="example-group-header" type="button" @click="toggleExampleGroup(group.name)">
                        <span class="example-group-caret"
                              x-text="expandedExampleGroups[group.name] ? '▾' : '▸'"></span>
                        <span x-text="group.name"></span>
                        <span class="example-group-count" x-text="group.examples.length"></span>
                      </button>
                      <div class="example-group-items" x-show="expandedExampleGroups[group.name]">
                        <template x-for="ex in group.examples" :key="ex.id">
                          <button class="example-item" type="button"
                                  :class="{ 'is-active': activeExampleId === ex.id }"
                                  @click="applyExample(ex)">
                            <span class="example-item-label" x-text="ex.label"></span>
                            <span class="example-item-meta" x-text="exampleMeta(ex)"></span>
                          </button>
                        </template>
                      </div>
                    </section>
                  </template>
                </div>
              </div>
            </template>

            <div class="sidebar-panel">
              <div class="sidebar-header">Search &amp; Filter</div>

              <div class="field has-addons">
                <div class="control is-expanded">
                  <input class="input" type="text" x-model="q"
                         placeholder="e.g. copper, gold, iron ore"
                         @keydown.enter="search()">
                </div>
                <div class="control">
                  <button class="btn-search" type="button" @click="search()">Search</button>
                </div>
              </div>

              <div class="limit-row">
                <div class="limit-control">
                  <label class="limit-label">Results</label>
                  <select class="limit-select" x-model.number="limit" @change="search()">
                    <template x-for="n in resultLimits" :key="n">
                      <option :value="n" x-text="n.toLocaleString()"></option>
                    </template>
                  </select>
                </div>
                <div class="limit-control">
                  <label class="limit-label">Facets</label>
                  <select class="limit-select" x-model.number="maxFacetValues" @change="search()">
                    <template x-for="n in facetLimits" :key="n">
                      <option :value="n" x-text="n.toLocaleString()"></option>
                    </template>
                  </select>
                </div>
                <div class="limit-control">
                  <label class="limit-label">Sort</label>
                  <select class="limit-select" x-model="sortField" @change="search()">
                    <option value="">Relevance</option>
                    <template x-for="opt in sortOptions()" :key="opt.value">
                      <option :value="opt.value" x-text="opt.label"></option>
                    </template>
                  </select>
                </div>
                <div class="limit-control" x-show="sortField">
                  <label class="limit-label">Order</label>
                  <select class="limit-select" x-model="sortDirection" @change="search()">
                    <option value="asc">asc</option>
                    <option value="desc">desc</option>
                  </select>
                </div>
              </div>

              <template x-if="hasActiveFilters()">
                <button class="btn-clear-filters" type="button" @click="clearFilters()">
                  &#10005; Clear all filters
                </button>
              </template>

              <template x-if="spatialBbox || spatialPolygon">
                <details class="facet-group" open>
                  <summary class="facet-group-label">spatial</summary>
                  <template x-if="spatialBbox">
                    <label class="facet-option spatial-filter-active">
                      <input type="checkbox" checked @change="clearBbox(); search()">
                      <span class="facet-value">Bounding box</span>
                    </label>
                  </template>
                  <template x-if="spatialPolygon">
                    <label class="facet-option spatial-filter-active">
                      <input type="checkbox" checked @change="clearPolygon(); search()">
                      <span class="facet-value">Polygon</span>
                    </label>
                  </template>
                </details>
              </template>

              <template x-if="temporalFields.length > 0">
                <details class="facet-group" open>
                  <summary class="facet-group-label">temporal range</summary>
                  <div class="temporal-panel">
                    <template x-for="fieldName in temporalFields" :key="fieldName">
                      <div class="temporal-card">
                        <div class="temporal-card-header">
                          <span class="temporal-title" x-text="temporalFieldLabel(fieldName)"></span>
                          <button class="temporal-clear-btn"
                                  type="button"
                                  x-show="temporalRangeSelection(fieldName).low || temporalRangeSelection(fieldName).high"
                                  @click="clearTemporalRange(fieldName)">clear</button>
                        </div>

                        <div class="temporal-input-row">
                          <label class="temporal-input-group">
                            <span>from</span>
                            <input class="input temporal-input"
                                   :type="temporalInputType(fieldName)"
                                   :value="temporalInputValue(fieldName, 'low')"
                                   @change="updateTemporalInput(fieldName, 'low', $event.target.value)">
                          </label>
                          <label class="temporal-input-group">
                            <span>to</span>
                            <input class="input temporal-input"
                                   :type="temporalInputType(fieldName)"
                                   :value="temporalInputValue(fieldName, 'high')"
                                   @change="updateTemporalInput(fieldName, 'high', $event.target.value)">
                          </label>
                        </div>

                        <div class="temporal-slider-dual">
                          <div class="temporal-slider-track"></div>
                          <div class="temporal-slider-range"
                               :style="temporalSliderRangeStyle(fieldName)"></div>
                          <input class="temporal-slider temporal-slider-low"
                                 type="range"
                                 :min="temporalSliderMin(fieldName)"
                                 :max="temporalSliderMax(fieldName)"
                                 :step="temporalSliderStep(fieldName)"
                                 :value="temporalSliderValue(fieldName, 'low')"
                                 @input="updateTemporalSlider(fieldName, 'low', $event.target.value)">
                          <input class="temporal-slider temporal-slider-high"
                                 type="range"
                                 :min="temporalSliderMin(fieldName)"
                                 :max="temporalSliderMax(fieldName)"
                                 :step="temporalSliderStep(fieldName)"
                                 :value="temporalSliderValue(fieldName, 'high')"
                                 @input="updateTemporalSlider(fieldName, 'high', $event.target.value)">
                        </div>

                        <div class="temporal-bound-row">
                          <span x-text="temporalBounds(fieldName).min"></span>
                          <span x-text="temporalBounds(fieldName).max"></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </details>
              </template>

              <template x-if="identifierKinds().length > 0">
                <details class="facet-group" open>
                  <summary class="facet-group-label">identifiers</summary>
                  <div class="filter-input-section">
                    <template x-for="kind in identifierKinds()" :key="kind.value">
                      <label class="correlated-input-group">
                        <span class="correlated-label" x-text="kind.label || kind.value"></span>
                        <div class="suggest" @click.outside="closeSuggest('id:' + kind.value)">
                          <input class="input correlated-input"
                                 type="text"
                                 autocomplete="off"
                                 :value="identifierKindValue(kind.value)"
                                 :placeholder="'Type ahead within ' + (kind.label || kind.value)"
                                 @focus="openSuggest('id:' + kind.value); ensureIdentifierKindSuggestions(kind.value, identifierKindValue(kind.value))"
                                 @input="setIdentifierKindValue(kind.value, $event.target.value); openSuggest('id:' + kind.value); ensureIdentifierKindSuggestions(kind.value, $event.target.value)"
                                 @keydown.arrow-down.prevent="moveSuggest(1, identifierKindSuggestions(kind.value).length)"
                                 @keydown.arrow-up.prevent="moveSuggest(-1, identifierKindSuggestions(kind.value).length)"
                                 @keydown.escape.stop="closeSuggest()"
                                 @keydown.enter.prevent="identifierEnter(kind.value)">
                          <div class="suggest-menu"
                               x-show="isSuggestOpen('id:' + kind.value) && identifierKindSuggestions(kind.value).length > 0"
                               x-cloak>
                            <template x-for="(child, i) in identifierKindSuggestions(kind.value)" :key="child.value">
                              <button type="button" class="suggest-item"
                                      :class="{ 'is-highlighted': suggestIndex === i }"
                                      @mouseenter="suggestIndex = i"
                                      @mousedown.prevent="chooseIdentifier(kind.value, child.value)">
                                <span class="suggest-item-label" x-text="child.label || child.value"></span>
                                <span class="suggest-item-count" x-text="child.count"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </label>
                    </template>
                  </div>
                </details>
              </template>

              <details class="facet-group" open>
                <summary class="facet-group-label">attribution</summary>
                <div class="filter-input-section">
                  <label class="correlated-input-group">
                    <span class="correlated-label">Role</span>
                    <div class="suggest" @click.outside="closeSuggest('attr:role')">
                      <input class="input correlated-input"
                             type="text"
                             autocomplete="off"
                             x-model="correlatedFilters.attributionRole"
                             placeholder="e.g. Principal Investigator"
                             @focus="openSuggest('attr:role')"
                             @input="openSuggest('attr:role')"
                             @keydown.arrow-down.prevent="moveSuggest(1, filteredAttributionRoles().length)"
                             @keydown.arrow-up.prevent="moveSuggest(-1, filteredAttributionRoles().length)"
                             @keydown.escape.stop="closeSuggest()"
                             @keydown.enter.prevent="correlatedPickEnter('attributionRole', filteredAttributionRoles())">
                      <div class="suggest-menu"
                           x-show="isSuggestOpen('attr:role') && filteredAttributionRoles().length > 0"
                           x-cloak>
                        <template x-for="(option, i) in filteredAttributionRoles()" :key="option">
                          <button type="button" class="suggest-item"
                                  :class="{ 'is-highlighted': suggestIndex === i }"
                                  @mouseenter="suggestIndex = i"
                                  @mousedown.prevent="chooseCorrelated('attributionRole', option)">
                            <span class="suggest-item-label" x-text="option"></span>
                          </button>
                        </template>
                      </div>
                    </div>
                  </label>
                  <!-- No suggestion list: the agent box is a text search against the
                       index, so it costs nothing to load and does not care how many
                       names exist. -->
                  <label class="correlated-input-group">
                    <span class="correlated-label">Agent</span>
                    <input class="input correlated-input"
                           type="text"
                           autocomplete="off"
                           x-model="correlatedFilters.attributionAgent"
                           placeholder="e.g. Sarah Jones"
                           @keydown.enter.prevent="search()">
                  </label>
                </div>

                <template x-if="correlatedFiltersActive()">
                  <button class="btn-clear-filters" type="button" @click="clearCorrelatedFilters(); search()">
                    &#10005; Clear these filters
                  </button>
                </template>
              </details>

              <template x-for="fieldName in sidebarFacetFields()" :key="fieldName">
                <div>
                  <template x-if="(facets[fieldName] || []).length > 0">
                    <details class="facet-group" open>
                      <summary class="facet-group-label" x-text="facetLabel(fieldName)" :title="fieldIRIs[fieldName] || fieldName"></summary>

                      <!-- Hierarchy facets: expandable tree -->
                      <template x-if="isHierarchy(fieldName)">
                        <div>
                          <template x-for="fv in visibleFacets(fieldName)" :key="fv.value">
                            <div class="hierarchy-parent">
                              <div class="facet-option hierarchy-row">
                                <button class="hierarchy-chevron-btn"
                                        type="button"
                                        @click="toggleHierarchy(fieldName, fv.value)"
                                        :aria-label="(isHierarchyOpen(fieldName, fv.value) ? 'Collapse ' : 'Expand ') + (fv.label || fv.value)">
                                  <span class="hierarchy-chevron"
                                      x-text="isHierarchyOpen(fieldName, fv.value) ? '\u25BE' : '\u25B8'"></span>
                                </button>
                                <span class="facet-value" x-text="fv.label || fv.value" :title="fv.value"></span>
                                <span class="facet-count" x-text="fv.count"></span>
                              </div>
                              <template x-if="isHierarchyOpen(fieldName, fv.value)">
                                <div class="hierarchy-children">
                                  <template x-if="isHierarchyLoading(fieldName, fv.value)">
                                    <div class="hierarchy-loading">Loading...</div>
                                  </template>
                                  <template x-for="child in getHierarchyChildren(fieldName, fv.value)" :key="child.value">
                                    <button class="facet-option hierarchy-child"
                                            type="button"
                                            :class="{ 'is-selected': isHierarchyChildSelected(fieldName, child.value) }"
                                            @click="toggleHierarchyChild(fieldName, fv.value, child.value)">
                                      <span class="facet-value" x-text="child.label || child.value" :title="child.value"></span>
                                      <span class="facet-count" x-text="child.count"></span>
                                    </button>
                                  </template>
                                  <template x-if="!isHierarchyLoading(fieldName, fv.value) && getHierarchyChildren(fieldName, fv.value).length === 0">
                                    <div class="hierarchy-empty">No children</div>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>

                      <!-- Flat facets: checkboxes -->
                      <template x-if="!isHierarchy(fieldName)">
                        <div>
                          <template x-for="fv in visibleFacets(fieldName)" :key="fv.value">
                            <label class="facet-option">
                              <input type="checkbox"
                                     :checked="isSelected(fieldName, fv.value)"
                                     @change="toggleFacet(fieldName, fv.value)">
                              <span class="facet-value" x-text="fv.label || fv.value" :title="fv.value"></span>
                              <span class="facet-count" x-text="fv.count"></span>
                            </label>
                          </template>
                        </div>
                      </template>

                      <template x-if="(facets[fieldName] || []).length > 5">
                        <button class="facet-toggle-btn"
                                @click="facetExpanded[fieldName] = !facetExpanded[fieldName]">
                          <span x-text="facetExpanded[fieldName]
                            ? '\u25B4 Show less'
                            : '\u25BE Show all ' + (facets[fieldName] || []).length"></span>
                        </button>
                      </template>
                    </details>
                  </template>
                </div>
              </template>

            </div>
          </div>
        </div>

        <!-- Resize handle: left -->
        <div class="resize-handle" @mousedown="startResizeLeft($event)"></div>

        <!-- Main content: results -->
        <div class="column">

          <template x-if="!error && cards.length === 0 && !loading">
            <div class="notice-empty">
              No results found. Try broadening your search or clearing filters.
            </div>
          </template>

          <template x-for="card in cards" :key="card.uri">
            <div class="result-card" :data-uri="card.uri"
                 :class="{ 'is-highlighted': $store.app.highlightUri === card.uri }">
              <div class="result-card-header">
                <span class="result-card-label" x-text="card.label"></span>
                <div class="result-card-actions">
                  <button class="result-card-ttl-toggle"
                          type="button"
                          :class="{ 'is-active': card.turtleOpen }"
                          @click="toggleCardTurtle(card)"
                          x-text="cardTurtleButtonLabel(card)">
                  </button>
                  <span class="result-card-score">
                    <span class="score-label">score</span>
                    <span class="score-value" x-text="card.score.toFixed(2)"></span>
                  </span>
                </div>
              </div>

              <template x-if="card.description">
                <p class="result-description"
                   x-text="card.description.length > 300
                     ? card.description.substring(0, 300) + '\u2026'
                     : card.description">
                </p>
              </template>

              <template x-if="card.rows.length > 0">
                <table class="result-props">
                  <tbody>
                    <template x-for="(row, ri) in card.rows" :key="ri">
                      <tr>
                        <th x-text="row.property"></th>
                        <td>
                          <div class="prop-values" x-show="row.values.length > 0">
                            <template x-for="(value, vi) in row.values" :key="vi">
                              <span class="prop-value" :title="value.tooltip || ''">
                                <span x-text="value.displayValue || value.value"></span>
                                <template x-if="value.badge">
                                  <span class="type-badge" x-text="value.badge"></span>
                                </template>
                              </span>
                            </template>
                          </div>
                          <template x-if="row.children">
                            <div class="prop-nested">
                              <template x-for="(parts, ci) in row.children" :key="ci">
                                <div class="prop-nested-node">
                                  <template x-for="(part, pi) in parts" :key="pi">
                                    <span class="prop-nested-part">
                                      <span class="prop-nested-key" x-text="part.property"></span>
                                      <span class="prop-value" :title="part.tooltip || ''">
                                        <span x-text="part.displayValue || part.value"></span>
                                        <template x-if="part.badge">
                                          <span class="type-badge" x-text="part.badge"></span>
                                        </template>
                                      </span>
                                    </span>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>

              <div class="result-turtle-panel" x-show="card.turtleOpen">
                <template x-if="card.turtleLoading">
                  <div class="result-turtle-status">Loading Turtle...</div>
                </template>
                <template x-if="card.turtleError">
                  <div class="result-turtle-error" x-text="card.turtleError"></div>
                </template>
                <template x-if="card.turtleText && !card.turtleLoading">
                  <pre class="result-turtle-pre"><code x-text="card.turtleText"></code></pre>
                </template>
              </div>
            </div>
          </template>

        </div>

        <!-- Resize handle -->
        <div class="resize-handle" @mousedown="startResize($event)"
             x-show="$store.app.showMap || $store.app.showLog"></div>

        <!-- Right panel: map + log -->
        <div class="column right-panel" x-show="$store.app.showMap || $store.app.showLog" x-transition.opacity>

          <div class="map-panel" x-show="$store.app.showMap">
            <div class="map-header">
              <span class="sidebar-header" style="margin-bottom:0">Map</span>
              <div class="map-controls">
                <template x-if="!drawingPolygon">
                  <button class="btn-map-tool" type="button"
                          :class="{ 'is-active': drawingBbox }"
                          @click="drawingBbox ? cancelBboxDraw() : enableBboxDraw()"
                          title="Draw bounding box to filter results spatially">
                    <span class="map-tool-icon">&#9633;</span> Bbox
                  </button>
                </template>
                <template x-if="!drawingBbox">
                  <button class="btn-map-tool" type="button"
                          :class="{ 'is-active': drawingPolygon }"
                          @click="drawingPolygon ? cancelPolygonDraw() : enablePolygonDraw()"
                          title="Click map to place vertices, then press Done to apply filter">
                    <span class="map-tool-icon">&#11040;</span> Polygon
                  </button>
                </template>
                <template x-if="drawingPolygon && polyPoints.length >= 3">
                  <button class="btn-map-tool is-active" type="button"
                          @click="finishPolygonDraw()"
                          title="Close polygon and apply spatial filter">
                    &#10003; Done
                  </button>
                </template>
                <template x-if="drawingPolygon">
                  <span class="bbox-label"
                        x-text="polyPoints.length + ' point' + (polyPoints.length !== 1 ? 's' : '') + (polyPoints.length < 3 ? ' (need 3+)' : '')">
                  </span>
                </template>
                <template x-if="spatialBbox && !drawingBbox && !drawingPolygon">
                  <button class="btn-map-tool btn-map-clear" type="button"
                          @click="clearBboxAndSearch()"
                          title="Remove bbox filter">
                    &#10005; Bbox
                  </button>
                </template>
                <template x-if="spatialPolygon && !drawingBbox && !drawingPolygon">
                  <button class="btn-map-tool btn-map-clear" type="button"
                          @click="clearPolygonAndSearch()"
                          title="Remove polygon filter">
                    &#10005; Polygon
                  </button>
                </template>
                <template x-if="spatialBbox && !drawingBbox && !drawingPolygon">
                  <span class="bbox-label" x-text="spatialBbox.map(n => n.toFixed(1)).join(', ')"></span>
                </template>
                <template x-if="spatialPolygon && !drawingBbox && !drawingPolygon">
                  <span class="bbox-label" x-text="(spatialPolygon.length - 1) + ' vertices'"></span>
                </template>
              </div>
            </div>
            <div id="search-map"></div>
          </div>

          <div class="query-log-panel" x-show="$store.app.showLog">
            <div class="sidebar-header">Log</div>

            <template x-if="queryLog.length === 0">
              <p class="query-log-empty">Queries will appear here as you search.</p>
            </template>

            <template x-for="(entry, i) in queryLog" :key="i">
              <button type="button"
                   class="query-log-entry"
                   :class="{ 'is-new': i === 0, 'is-sparql': entry.isSparql, 'is-cql': entry.isCql }"
                   :disabled="!entry.isSparql && !entry.isCql"
                   @click="entry.isSparql ? openEditor(entry.query) : (entry.isCql && openCql(entry.query))"
                   :title="entry.isSparql ? 'Open in the SPARQL editor' : (entry.isCql ? 'View the CQL filter' : entry.label)">
                <span class="query-log-timestamp" x-text="entry.time"></span>
                <span class="query-log-label" x-text="entry.label"></span>
              </button>
            </template>
          </div>

        </div>

      </div>

      <nav class="pagination-bar" aria-label="pagination">
        <button class="pagination-btn" :disabled="currentPage <= 1"
                @click="goToPage(currentPage - 1)">&lsaquo; Prev</button>
        <!-- Keyed by position, not by value: a middle page has an ellipsis on both sides,
             so keying on the value gives two identical keys and Alpine reorders and drops
             nodes. The list is short and positional, so the index is the honest key. -->
        <template x-for="(p, i) in paginationRange()" :key="i">
          <button class="pagination-btn" :class="{ 'is-current': p === currentPage }"
                  x-text="p === '...' ? '\u2026' : p"
                  :disabled="p === '...'"
                  @click="p !== '...' && goToPage(p)"></button>
        </template>
        <button class="pagination-btn" :disabled="currentPage >= totalPages()"
                @click="goToPage(currentPage + 1)">Next &rsaquo;</button>
      </nav>

      <!-- SPARQL Editor (must be inside x-data scope) -->
      <div class="sparql-editor" x-show="editorOpen" x-cloak
           @click.outside="closeEditor()"
           :style="`right:${_editorRight}px; top:${_editorTop}px; width:${_editorWidth}px`">
        <div class="sparql-editor-header" @mousedown.prevent="
          const startX = $event.clientX, startY = $event.clientY;
          const startR = _editorRight, startT = _editorTop;
          const move = e => { _editorRight = startR - (e.clientX - startX); _editorTop = startT + (e.clientY - startY); };
          const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
          window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        ">
          <span>SPARQL Editor</span>
          <button class="sparql-editor-close" @click="closeEditor()">&times;</button>
        </div>
        <div class="sparql-editor-resize" @mousedown.prevent="
          const startX = $event.clientX, startW = _editorWidth;
          const move = e => { _editorWidth = Math.max(320, startW - (e.clientX - startX)); };
          const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
          window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        "></div>
        <div class="sparql-editor-body">
          <textarea class="sparql-editor-input" x-model="editorQuery"
                    @keydown.ctrl.enter="runEditorQuery()"
                    @keydown.meta.enter="runEditorQuery()"></textarea>
          <div class="sparql-editor-toolbar">
            <button class="sparql-editor-run" @click="runEditorQuery()" :disabled="editorRunning">
              <span x-text="editorRunning ? 'Running...' : 'Run (Ctrl+Enter)'"></span>
            </button>
            <template x-if="editorHasTable()">
              <div class="sparql-editor-view-toggle">
                <button :class="{ active: editorView === 'table' }" @click="editorView = 'table'">Table</button>
                <button :class="{ active: editorView === 'json' }" @click="editorView = 'json'">JSON</button>
              </div>
            </template>
            <input class="sparql-editor-endpoint-input" type="text" x-model="editorEndpoint"
                   @keydown.ctrl.enter="runEditorQuery()" @keydown.meta.enter="runEditorQuery()">
          </div>
          <template x-if="editorError">
            <pre class="sparql-editor-error" x-text="editorError"></pre>
          </template>
          <template x-if="editorResults && editorView === 'json'">
            <pre class="sparql-editor-results"><code x-text="editorResults"></code></pre>
          </template>
          <template x-if="editorHasTable() && editorView === 'table'">
            <div class="sparql-editor-table-wrap">
              <table class="sparql-editor-table">
                <thead>
                  <tr>
                    <template x-for="v in editorTableVars()" :key="v">
                      <th x-text="'?' + v"></th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, ri) in editorTableRows()" :key="ri">
                    <tr>
                      <template x-for="(cell, ci) in row" :key="ci">
                        <td x-text="cell"></td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>
      </div>

      <!-- CQL Viewer -->
      <div class="cql-viewer" x-show="cqlOpen" x-cloak
           @click.outside="closeCql()"
           :style="`right:${_cqlRight}px; top:${_cqlTop}px; width:${_cqlWidth}px`">
        <div class="cql-viewer-header" @mousedown.prevent="
          const startX = $event.clientX, startY = $event.clientY;
          const startR = _cqlRight, startT = _cqlTop;
          const move = e => { _cqlRight = startR - (e.clientX - startX); _cqlTop = startT + (e.clientY - startY); };
          const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
          window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        ">
          <span>CQL Filter</span>
          <div class="cql-viewer-actions">
            <div class="sparql-editor-view-toggle">
              <button :class="{ active: cqlView === 'object' }" @click="cqlView = 'object'">Object</button>
              <button :class="{ active: cqlView === 'raw' }" @click="cqlView = 'raw'">Raw</button>
            </div>
            <template x-if="cqlView === 'object'">
              <button class="cql-viewer-btn" @click="$refs.cqlTree.querySelectorAll('details').forEach(d => d.open = true)">Expand all</button>
            </template>
            <template x-if="cqlView === 'object'">
              <button class="cql-viewer-btn" @click="$refs.cqlTree.querySelectorAll('details').forEach(d => d.open = false)">Collapse all</button>
            </template>
            <button class="cql-viewer-close" @click="closeCql()">&times;</button>
          </div>
        </div>
        <template x-if="cqlView === 'object'">
          <div class="cql-viewer-body" x-ref="cqlTree" x-html="cqlJson ? renderJsonTree(cqlJson) : ''"></div>
        </template>
        <template x-if="cqlView === 'raw'">
          <pre class="cql-viewer-raw"><code x-text="cqlRaw"></code></pre>
        </template>
      </div>

    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const burger = document.querySelector('.navbar-burger');
      const menu = document.getElementById(burger.dataset.target);
      burger.addEventListener('click', () => {
        burger.classList.toggle('is-active');
        menu.classList.toggle('is-active');
      });

      requestAnimationFrame(() => {
        document.querySelector('.main-content').classList.add('is-visible');
      });
    });
  </script>
</body>
</html>
