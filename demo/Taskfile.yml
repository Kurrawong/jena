version: '3'

vars:
  ## Must track the root pom's <version>. Override with VERSION=... if building
  ## against a differently-versioned jar.
  VERSION: '{{.VERSION | default "6.2.0-SNAPSHOT"}}'
  FUSEKI_JAR: ../jena-fuseki2/jena-fuseki-server/target/jena-fuseki-server-{{.VERSION}}.jar
  FUSEKI_PORT: '{{.FUSEKI_PORT | default "3030"}}'
  APP_PORT: '{{.APP_PORT | default "8000"}}'
  SERVER_URL: http://localhost:{{.FUSEKI_PORT}}
  IMAGE_NAME: '{{.IMAGE_NAME | default "fuseki-lucene-shacl"}}'
  IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
  GHCR_OWNER: '{{.GHCR_OWNER | default "kurrawong"}}'

tasks:
  # ── Build ────────────────────────────────────────────────

  build:
    desc: Build the Fuseki server JAR (includes jena-text)
    dir: ..
    cmds:
      - mvn clean install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests

  build-fast:
    desc: Incremental Fuseki server build without clean
    dir: ..
    cmds:
      - mvn install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests

  # ── Run the demo (local JAR) ─────────────────────────────

  refresh:
    desc: Clean, load offline, bulk-index, start Fuseki, then launch the app
    cmds:
      # Load and index with the server DOWN, then bring it up on a finished index.
      # The boreholes' assay children come from a CSV and can only be built by the
      # bulk indexer, so pushing data into a running server is no longer enough.
      - task: stop-all
      - task: load-offline
      - task: index
      - task: start-fuseki
      - task: app

  refresh-fast:
    desc: Restart Fuseki and app without deleting DB/Lucene or reloading data
    cmds:
      - task: stop-all
      - task: start-fuseki
      - task: app

  rebuild-start:
    desc: Rebuild Fuseki, restart the demo server, reload data, then launch the app
    cmds:
      - task: build
      - task: refresh

  rebuild-start-fast:
    desc: Incremental rebuild and restart without clean reindex
    cmds:
      - task: build-fast
      - task: refresh-fast

  serve:
    desc: Start Fuseki with the mining config (foreground)
    dir: test
    cmds:
      - task: require-jar
      - java -jar ../{{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl

  app:
    desc: Serve the static demo app against a running Fuseki
    cmds:
      - ln -sfn ../test/config.ttl app-static/config.ttl
      - ln -sfn ../test/tests.json app-static/tests.json
      # This file is committed and RAT-checked, so the licence header has to survive
      # regeneration, and the output has to match the committed bytes exactly —
      # otherwise every demo run leaves the tree dirty. Keep labelCacheVersion:
      # labels.js reads it as the cache salt.
      - |
        cat > app-static/app-config.js <<'CONFIG'
        /* Licensed under the terms of http://www.apache.org/licenses/LICENSE-2.0 */

        window.APP_CONFIG = {
          fusekiBase: '/fuseki',
          // Cache salt for label lookups. Labels are cached by the browser for a day
          // (see serve_app.py); bump this to invalidate every cached label at once.
          labelCacheVersion: '1',
        };
        CONFIG
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - echo "Serving at http://localhost:{{.APP_PORT}} (mining proxy → {{.SERVER_URL}})"
      - python3 serve_app.py --port {{.APP_PORT}} --directory app-static --backend {{.SERVER_URL}}

  stop:
    desc: Stop the running Fuseki server (sends SIGTERM for clean shutdown)
    cmds:
      - pkill -f "jena-fuseki-server" && echo "Server stopped" || echo "No server running"

  # ── Data and index ───────────────────────────────────────

  load:
    desc: Load the mining dataset via GSP into a running server
    cmds:
      - |
        curl -s -X PUT "{{.SERVER_URL}}/mining/data?default" \
          -H "Content-Type: text/turtle" \
          --data-binary @test/data/mining.ttl
      - echo "Loaded test/data/mining.ttl"
      - |
        curl -s -X POST "{{.SERVER_URL}}/mining/data?default" \
          -H "Content-Type: text/turtle" \
          --data-binary @test/data/generated.ttl
      - echo "Loaded test/data/generated.ttl"

  load-offline:
    desc: Load the mining dataset straight into TDB2 (no server; bypasses the change listener)
    # dir must sit on the task, not on the command: Task silently ignores a command-level
    # dir, which sends every relative path in here one directory too high.
    dir: test
    cmds:
      # Guard before clean, not after: a missing jar must not cost you the database.
      - task: require-jar
      - task: clean
      - java -cp ../{{.FUSEKI_JAR}} tdb2.tdbloader --loc=DB data/mining.ttl data/generated.ttl

  index:
    desc: Bulk-index all shapes, including the boreholes' external assay CSV
    dir: test
    cmds:
      - task: require-jar
      # BoreholeShape declares an idx:externalSource, which makes it rebuild-only:
      # a live graph change cannot re-derive assay children, so the change listener
      # refuses to touch those documents. This is the step that builds them.
      # Requires exclusive TDB2 access, so the server must be stopped.
      - java -cp ../{{.FUSEKI_JAR}} org.apache.jena.query.text.cmd.shacltextindexer --desc=config.ttl

  clean:
    desc: Remove mining TDB2, Lucene and facet-taxonomy directories
    dir: test
    cmds:
      # Taxonomy goes with the index: ordinals from a previous build would no longer
      # line up with freshly written documents.
      - rm -rf DB Lucene Taxonomy
      - echo "Cleaned mining DB, Lucene and Taxonomy directories"

  # ── Checks ───────────────────────────────────────────────

  query:
    desc: Run every query in test/queries against the mining server
    dir: test
    # No fingerprinting: this is a check to re-run on demand, not a build step.
    method: none
    sources:
      - queries/*.rq
    cmds:
      - for: sources
        cmd: |
          echo "=== {{.ITEM}} ==="
          curl -s -X POST "{{.SERVER_URL}}/mining/query" \
            -H "Content-Type: application/sparql-query" \
            -H "Accept: text/tab-separated-values" \
            --data-binary @{{.ITEM}}
          echo ""

  test:
    desc: Run Playwright screenshot tests and generate report
    dir: testing
    cmds:
      - npx playwright test
      - npx tsx lib/report.ts
      - echo "Report written to testing/results/report.md"

  # ── Docker ───────────────────────────────────────────────
  # Each of these runs the local image; add GHCR=1 to pull and run the published one.

  docker-start:
    desc: Start Fuseki in Docker, detached (GHCR=1 for the published image)
    cmds:
      - task: compose
        vars: {ARGS: 'up -d', PULL: 'yes'}
      - echo "Fuseki starting at {{.SERVER_URL}}"

  docker-serve:
    desc: Start Fuseki in Docker, foreground with logs (GHCR=1 for the published image)
    cmds:
      - task: compose
        vars: {ARGS: 'up', PULL: 'yes'}

  docker-stop:
    desc: Stop the Docker Fuseki container
    cmds:
      - task: compose
        vars: {ARGS: 'down'}
      - echo "Fuseki stopped"

  docker-clean:
    desc: Stop Fuseki and remove Docker volumes (DB + Lucene index)
    cmds:
      - task: compose
        vars: {ARGS: 'down -v'}
      - echo "Fuseki stopped and volumes removed"

  loader-index:
    desc: Reindex an existing TDB2 store with the loader image (GHCR=1 for the published image)
    cmds:
      - task: compose
        vars:
          DIR: loader
          SERVICE: loader
          BASE: fuseki-lucene-shacl-loader
          PULL: 'yes'
          ARGS: 'run --rm -e MODE=index loader'

  # ── Internal helpers ─────────────────────────────────────

  compose:
    internal: true
    dir: '{{.DIR | default "test"}}'
    # The registry prefix has to be resolved here, not in the global vars: a var set on
    # the command line (GHCR=1) is not yet visible when those are evaluated.
    vars:
      IMAGE: '{{if .GHCR}}ghcr.io/{{.GHCR_OWNER}}/{{end}}{{.BASE | default .IMAGE_NAME}}'
    env:
      IMAGE_NAME: '{{.IMAGE}}'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - echo "Image {{.IMAGE}}:{{.IMAGE_TAG}}"
      # Only the published image needs pulling; the local one is built by the root
      # task file and would not exist in a registry.
      - '{{if and .GHCR .PULL}}docker compose pull {{.SERVICE | default "fuseki"}}{{else}}true{{end}}'
      - docker compose {{.ARGS}}

  # Every task that shells out to the jar checks it first. Without this, a missing or
  # half-built jar surfaces as "Could not find or load main class", which reads like a
  # packaging problem rather than "you have not run task build".
  require-jar:
    internal: true
    dir: test
    cmds:
      - |
        test -f ../{{.FUSEKI_JAR}} || {
          echo "Fuseki jar not found: demo/test/{{.FUSEKI_JAR}}"
          echo "Run 'task build' first, or pass VERSION=... if the pom version has moved."
          exit 1
        }

  stop-all:
    internal: true
    cmds:
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - pkill -f "jena-fuseki-server.*--port {{.FUSEKI_PORT}}" || true

  start-fuseki:
    internal: true
    desc: Start Fuseki in the background and block until it answers /$/ping
    dir: test
    cmds:
      - task: require-jar
      - rm -f fuseki.log
      - nohup java -jar ../{{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl > fuseki.log 2>&1 &
      - |
        for i in $(seq 1 30); do
          if curl -sf "{{.SERVER_URL}}/$/ping" >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "Fuseki failed to start; see demo/test/fuseki.log"
        exit 1
