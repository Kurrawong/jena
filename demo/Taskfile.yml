version: '3'

vars:
  VERSION: 6.1.0-SNAPSHOT
  FUSEKI_JAR: ../jena-fuseki2/jena-fuseki-server/target/jena-fuseki-server-{{.VERSION}}.jar
  FUSEKI_PORT: '{{.FUSEKI_PORT | default "3030"}}'
  APP_PORT: '{{.APP_PORT | default "8000"}}'
  SERVER_URL: http://localhost:{{.FUSEKI_PORT}}
  IMAGE_NAME: '{{.IMAGE_NAME | default "fuseki-ai"}}'
  IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
  GHCR_OWNER: '{{.GHCR_OWNER | default "aiworkerjohns"}}'

tasks:
  # ── Shared ───────────────────────────────────────────────

  build:
    desc: Build the Fuseki server JAR (includes jena-text)
    dir: ..
    cmds:
      - mvn clean install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests

  build-fast:
    desc: Incremental Fuseki server build without clean
    dir: ..
    cmds:
      - mvn install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests

  stop:
    desc: Stop the running Fuseki server (sends SIGTERM for clean shutdown)
    cmds:
      - pkill -f "jena-fuseki-server" && echo "Server stopped" || echo "No server running"

  overview:
    desc: Serve the project overview presentation
    cmds:
      - echo "Serving at http://localhost:8001"
      - cmd: python3 -m http.server 8001 --directory project-overview

  test:
    desc: Run Playwright screenshot tests and generate report
    dir: testing
    cmds:
      - npx playwright test
      - npx tsx lib/report.ts
      - echo "Report written to testing/results/report.md"

  # ── Mining ───────────────────────────────────────────────

  serve:
    desc: Start Fuseki with the mining config
    dir: test
    cmds:
      - java -jar ../{{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl

  load:
    desc: Load the mining dataset via GSP
    cmds:
      - |
        curl -s -X PUT "{{.SERVER_URL}}/mining/data?default" \
          -H "Content-Type: text/turtle" \
          --data-binary @test/data/mining.ttl
      - echo "Loaded test/data/mining.ttl"
      - |
        curl -s -X POST "{{.SERVER_URL}}/mining/data?default" \
          -H "Content-Type: text/turtle" \
          --data-binary @test/data/generated.ttl
      - echo "Loaded test/data/generated.ttl"

  load-offline:
    desc: Load the mining dataset straight into TDB2 (no server; bypasses the change listener)
    dir: test
    cmds:
      - rm -rf DB Lucene Taxonomy
      - java -cp ../{{.FUSEKI_JAR}} tdb2.tdbloader --loc=DB data/mining.ttl data/generated.ttl

  index:
    desc: Bulk-index all shapes, including the boreholes' external assay CSV
    dir: test
    cmds:
      # BoreholeShape declares an idx:externalSource, which makes it rebuild-only:
      # a live graph change cannot re-derive assay children, so the change listener
      # refuses to touch those documents. This is the step that builds them.
      # Requires exclusive TDB2 access, so the server must be stopped.
      - java -cp ../{{.FUSEKI_JAR}} org.apache.jena.query.text.cmd.shacltextindexer --desc=config.ttl

  query:
    desc: Run all test queries against the mining server
    dir: test
    cmds:
      - for:
          - queries/01-basic-search.rq
          - queries/02-filtered-search.rq
          - queries/03-facet-counts.rq
          - queries/04-facet-filtered.rq
          - queries/05-combined.rq
          - queries/06-sequence-path-facet.rq
          - queries/07-filter-by-author.rq
          - queries/08-spatial-bbox.rq
          - queries/09-matchraw-multivalue.rq
          - queries/10-match-field-details.rq
          - queries/11-hierarchical-facets.rq
          - queries/12-range-facets.rq
          - queries/13-mixed-facets.rq
          - queries/14-nested-identifier-hierarchy.rq
          - queries/15-nested-identifier-prefix-search.rq
          - queries/16-sort-by-year-desc.rq
          - queries/17-sort-boreholes-by-depth-asc.rq
          - queries/18-nested-identifier-company-drilldown.rq
          - queries/19-nested-identifier-exact-pair.rq
          - queries/20-date-range-filter.rq
          - queries/21-match-review-note-languages.rq
          - queries/22-match-qa-passed-boolean.rq
        cmd: |
          echo "=== {{.ITEM}} ==="
          curl -s -X POST "{{.SERVER_URL}}/mining/query" \
            -H "Content-Type: application/sparql-query" \
            -H "Accept: text/tab-separated-values" \
            --data-binary @{{.ITEM}}
          echo ""


  app:
    desc: Serve the static demo app with mining config
    cmds:
      - ln -sfn ../test/config.ttl app-static/config.ttl
      - ln -sfn ../test/tests.json app-static/tests.json
      - |
        printf "window.APP_CONFIG = {\n  fusekiBase: '/fuseki',\n};\n" > app-static/app-config.js
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - echo "Serving at http://localhost:{{.APP_PORT}} (mining proxy → {{.SERVER_URL}})"
      - cmd: python3 serve_app.py --port {{.APP_PORT}} --directory app-static --backend {{.SERVER_URL}}

  refresh:
    desc: Clean, load offline, bulk-index, start Fuseki, then launch the app
    cmds:
      # Load and index with the server DOWN, then bring it up on a finished index.
      # The boreholes' assay children come from a CSV and can only be built by the
      # bulk indexer, so pushing data into a running server is no longer enough.
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - pkill -f "jena-fuseki-server.*--port {{.FUSEKI_PORT}}" || true
      - task: load-offline
      - task: index
      - |
        cd test
        rm -f fuseki.log
        nohup java -jar ../{{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl > fuseki.log 2>&1 &
      - |
        for i in $(seq 1 30); do
          if curl -sf "{{.SERVER_URL}}/$/ping" >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "Fuseki failed to start; see demo/test/fuseki.log"
        exit 1
      - task app FUSEKI_PORT={{.FUSEKI_PORT}} APP_PORT={{.APP_PORT}}

  refresh-fast:
    desc: Restart Fuseki and app without deleting DB/Lucene or reloading data
    cmds:
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - pkill -f "jena-fuseki-server.*--port {{.FUSEKI_PORT}}" || true
      - |
        cd test
        rm -f fuseki.log
        nohup java -jar ../{{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl > fuseki.log 2>&1 &
      - |
        for i in $(seq 1 30); do
          if curl -sf "{{.SERVER_URL}}/$/ping" >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "Fuseki failed to start; see demo/test/fuseki.log"
        exit 1
      - task app FUSEKI_PORT={{.FUSEKI_PORT}} APP_PORT={{.APP_PORT}}

  rebuild-start:
    desc: Rebuild Fuseki, restart the demo server, reload data, then launch the app
    cmds:
      - task build
      - task refresh FUSEKI_PORT={{.FUSEKI_PORT}} APP_PORT={{.APP_PORT}}

  rebuild-start-fast:
    desc: Incremental rebuild and restart without clean reindex
    cmds:
      - task build-fast
      - task refresh-fast FUSEKI_PORT={{.FUSEKI_PORT}} APP_PORT={{.APP_PORT}}

  clean:
    desc: Remove mining TDB2, Lucene and facet-taxonomy directories
    dir: test
    cmds:
      # Taxonomy goes with the index: ordinals from a previous build would no longer
      # line up with freshly written documents.
      - rm -rf DB Lucene Taxonomy
      - echo "Cleaned mining DB, Lucene and Taxonomy directories"

  docker-start:
    desc: Start Fuseki in Docker (detached)
    dir: test
    env:
      IMAGE_NAME: '{{.IMAGE_NAME}}'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - docker compose up -d
      - echo "Fuseki starting at {{.SERVER_URL}}"

  docker-start-ghcr:
    desc: Start Fuseki in Docker (detached) using the GHCR image
    dir: test
    env:
      IMAGE_NAME: 'ghcr.io/{{.GHCR_OWNER}}/{{.IMAGE_NAME}}'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - docker compose pull fuseki
      - docker compose up -d
      - echo "Fuseki starting at {{.SERVER_URL}} using ghcr.io/{{.GHCR_OWNER}}/{{.IMAGE_NAME}}:{{.IMAGE_TAG}}"

  docker-stop:
    desc: Stop the Docker Fuseki container
    dir: test
    cmds:
      - docker compose down
      - echo "Fuseki stopped"

  docker-clean:
    desc: Stop Fuseki and remove Docker volumes (DB + Lucene index)
    dir: test
    cmds:
      - docker compose down -v
      - echo "Fuseki stopped and volumes removed"

  docker-serve:
    desc: Start Fuseki in Docker (foreground with logs)
    dir: test
    env:
      IMAGE_NAME: '{{.IMAGE_NAME}}'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - docker compose up

  docker-serve-ghcr:
    desc: Start Fuseki in Docker (foreground with logs) using the GHCR image
    dir: test
    env:
      IMAGE_NAME: 'ghcr.io/{{.GHCR_OWNER}}/{{.IMAGE_NAME}}'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - docker compose pull fuseki
      - docker compose up

  # ── Loader / Reindexer ──────────────────────────────────

  loader-index:
    desc: Run the loader image in text-only reindex mode against an existing TDB2 store
    dir: loader
    env:
      IMAGE_NAME: 'fuseki-loader'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
      MODE: 'index'
    cmds:
      - docker compose run --rm -e MODE={{.MODE}} loader

  loader-index-ghcr:
    desc: Run the GHCR loader image in text-only reindex mode against an existing TDB2 store
    dir: loader
    env:
      IMAGE_NAME: 'ghcr.io/{{.GHCR_OWNER}}/fuseki-loader'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
      MODE: 'index'
    cmds:
      - docker compose pull loader
      - docker compose run --rm -e MODE={{.MODE}} loader
