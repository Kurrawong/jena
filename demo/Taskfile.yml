version: '3'

vars:
  # Derived from the root pom so it cannot drift from the actual build output.
  VERSION:
    sh: grep -m1 '<version>' ../pom.xml 2>/dev/null | sed 's/.*<version>\(.*\)<\/version>.*/\1/'
  FUSEKI_JAR: ../jena-fuseki2/jena-fuseki-server/target/jena-fuseki-server-{{.VERSION}}.jar
  FUSEKI_PORT: '{{.FUSEKI_PORT | default "3040"}}'
  SERVER_URL: http://localhost:{{.FUSEKI_PORT}}
  # Lucene's Panama Vector API, as the runtime image's ENTRYPOINT passes it.
  JAVA_FLAGS: --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED

tasks:
  default:
    desc: Start Fuseki in the background and check every query
    cmds:
      - task: start
      - task: check

  build:
    desc: Build the Fuseki server jar (needed once, and after any Java change)
    dir: ..
    cmds:
      # clean, because without it the shade plugin re-shades the previous jar in target/
      # and the server runs the old classes.
      - mvn clean install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests -Drat.skip

  serve:
    desc: Start Fuseki in the foreground (Ctrl-C to stop)
    cmds:
      - task: require-jar
      - java {{.JAVA_FLAGS}} -jar {{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl

  start:
    desc: Start Fuseki in the background, logging to fuseki.log
    cmds:
      - task: stop
      - task: require-jar
      - rm -f fuseki.log
      - nohup java {{.JAVA_FLAGS}} -jar {{.FUSEKI_JAR}} --port {{.FUSEKI_PORT}} --config config.ttl > fuseki.log 2>&1 &
      - |
        for i in $(seq 1 60); do
          if curl -sf "{{.SERVER_URL}}/$/ping" >/dev/null 2>&1; then
            echo "Fuseki on {{.SERVER_URL}}, query endpoint {{.SERVER_URL}}/kitchen/query"
            exit 0
          fi
          sleep 1
        done
        echo "Fuseki did not start; see demo/fuseki.log"
        exit 1

  stop:
    desc: Stop a Fuseki started by `task start` on FUSEKI_PORT
    cmds:
      - pkill -f "jena-fuseki-server.*--port {{.FUSEKI_PORT}}" || true

  check:
    desc: Run every query and compare row counts with expected-rows.tsv
    cmds:
      - ./check.sh {{.SERVER_URL}}

  query:
    desc: Run every query in queries/ and print the results
    cmds:
      - |
        for f in queries/*.rq; do
          echo "=== $f ==="
          curl -s -X POST "{{.SERVER_URL}}/kitchen/query" \
            -H "Content-Type: application/sparql-query" \
            -H "Accept: text/tab-separated-values" \
            --data-binary @"$f"
          echo
        done

  require-jar:
    internal: true
    cmds:
      - |
        test -f {{.FUSEKI_JAR}} || {
          echo "Fuseki jar not found: {{.FUSEKI_JAR}}"
          echo "Run 'task build' first."
          exit 1
        }
