version: '3'

vars:
  # Derived from the root pom so it cannot drift from the actual build output.
  VERSION:
    sh: grep -m1 '<version>' ../pom.xml 2>/dev/null | sed 's/.*<version>\(.*\)<\/version>.*/\1/'
  FUSEKI_JAR: ../jena-fuseki2/jena-fuseki-server/target/jena-fuseki-server-{{.VERSION}}.jar
  FUSEKI_PORT: '{{.FUSEKI_PORT | default "3040"}}'
  APP_PORT: '{{.APP_PORT | default "8070"}}'
  SERVER_URL: http://localhost:{{.FUSEKI_PORT}}

tasks:
  default:
    desc: Build nothing, load everything, serve the app (the one command to run)
    cmds:
      - task: up

  up:
    desc: Reload the data, rebuild the index, start Fuseki, serve the app
    cmds:
      - task: down
      - task: load
      - task: index
      - task: start-fuseki
      - task: app

  build:
    desc: Build the Fuseki server JAR (needed once, and after any Java change)
    dir: ..
    cmds:
      - mvn install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests -Drat.skip

  # ── Data and index ───────────────────────────────────────

  load:
    desc: Load kitchen.ttl straight into TDB2, with the server down
    cmds:
      - task: require-jar
      - task: clean
      - java -cp {{.FUSEKI_JAR}} tdb2.tdbloader --loc=DB data/kitchen.ttl

  model:
    desc: Fetch the embedding model into ./models (~130MB, once)
    vars:
      MODEL: '{{.MODEL | default "BAAI/bge-small-en-v1.5"}}'
      MODEL_DIR: 'models/{{.MODEL | default "BAAI/bge-small-en-v1.5" | replace "/" "_"}}-onnx'
    status:
      - test -s {{.MODEL_DIR}}/model.onnx
    cmds:
      # The provider downloads these itself on first use, so this task is not required —
      # it exists so the ~130MB is a deliberate step on a good connection rather than a
      # surprise in the middle of an index build. `status:` above makes it a no-op once the
      # files are there.
      #
      # Same four files OnnxModelFiles asks for, flattened into one directory because the
      # tokenizer wants the ONNX and the vocabulary side by side. Nothing under models/ is
      # ever committed: it is gitignored and RAT-excluded.
      - mkdir -p {{.MODEL_DIR}}
      - |
        base="https://huggingface.co/{{.MODEL}}/resolve/main"
        for f in onnx/model.onnx tokenizer.json tokenizer_config.json config.json; do
          out="{{.MODEL_DIR}}/$(basename $f)"
          echo "  $f"
          curl -sSL --retry 3 --fail -o "$out.part" "$base/$f" && mv "$out.part" "$out"
        done
      - du -sh {{.MODEL_DIR}}
      - echo "Model ready. 'task index' and 'task serve' will use it without a download."

  embeddings-classpath:
    desc: Build jena-text-embeddings and write its classpath (needed by the onnx provider)
    cmds:
      # jena-text-embeddings is deliberately NOT a dependency of the Fuseki server jar — an
      # ML runtime must not ship by default with the text index — so the tasks that need it
      # assemble a classpath instead of relying on the shaded jar.
      - |
        cd .. && mvn -q -pl jena-text-embeddings -am -Pdev -DskipTests -Drat.skip install \
          && mvn -q -pl jena-text-embeddings dependency:build-classpath \
               -Dmdep.outputFile=$(pwd)/demo/.embeddings-cp
      - echo "Wrote .embeddings-cp"

  index:
    desc: Build the Lucene index, including the review children from the CSV
    cmds:
      - task: require-jar
      - task: embeddings-classpath
      # The review children come from an idx:externalSource, which makes the shape
      # rebuild-only: a live graph change cannot re-derive CSV rows, so the change
      # listener refuses to touch these documents. This is the step that builds them,
      # and it needs exclusive TDB2 access — hence "server down".
      # First run downloads ~130MB from HuggingFace into ./models. No --add-modules is
      # needed: ONNX Runtime does not use the Vector API.
      - java -cp "{{.FUSEKI_JAR}}:$(cat .embeddings-cp):../jena-text-embeddings/target/classes" org.apache.jena.query.text.cmd.shacltextindexer --desc=config.ttl

  clean:
    desc: Remove the TDB2 store, the Lucene index and the facet taxonomy
    cmds:
      # The taxonomy goes with the index: ordinals from a previous build would not line
      # up with freshly written documents.
      - rm -rf DB Lucene Taxonomy .embeddings-cp
      - echo "Cleaned DB, Lucene and Taxonomy"

  # ── Run ──────────────────────────────────────────────────

  serve:
    desc: Start Fuseki in the foreground (Ctrl-C to stop)
    cmds:
      - task: require-jar
      - task: embeddings-classpath
      - java -cp "{{.FUSEKI_JAR}}:$(cat .embeddings-cp):../jena-text-embeddings/target/classes" org.apache.jena.fuseki.main.cmds.FusekiServerCmd --port {{.FUSEKI_PORT}} --config config.ttl

  app:
    desc: Serve the static app against a running Fuseki
    cmds:
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - echo "App on http://localhost:{{.APP_PORT}} (proxying /fuseki -> {{.SERVER_URL}})"
      - python3 serve_app.py --port {{.APP_PORT}} --directory app --backend {{.SERVER_URL}}

  down:
    desc: Stop the app and the Fuseki server
    cmds:
      - pkill -f "serve_app.py --port {{.APP_PORT}}" || true
      - pkill -f "jena-fuseki-server.*--port {{.FUSEKI_PORT}}" || true
      - echo "Stopped"

  # ── Checks ───────────────────────────────────────────────

  query:
    desc: Run every .rq in queries/ against the running server
    method: none
    sources:
      - queries/*.rq
    cmds:
      - for: sources
        cmd: |
          echo "=== {{.ITEM}} ==="
          curl -s -X POST "{{.SERVER_URL}}/kitchen/query" \
            -H "Content-Type: application/sparql-query" \
            -H "Accept: text/tab-separated-values" \
            --data-binary @{{.ITEM}}
          echo ""

  check:
    desc: Run every query and compare row counts with expected-rows.tsv
    cmds:
      - ./check.sh {{.SERVER_URL}}

  config:
    desc: Show what the server resolved, including the index fingerprint status
    cmds:
      - curl -s "{{.SERVER_URL}}/$/config/effective" | python3 -m json.tool

  # ── Internal ─────────────────────────────────────────────

  require-jar:
    internal: true
    cmds:
      - |
        test -f {{.FUSEKI_JAR}} || {
          echo "Fuseki jar not found: {{.FUSEKI_JAR}}"
          echo "Run 'task build' first."
          exit 1
        }

  start-fuseki:
    internal: true
    cmds:
      - task: require-jar
      - task: embeddings-classpath
      - rm -f fuseki.log
      - nohup java -cp "{{.FUSEKI_JAR}}:$(cat .embeddings-cp):../jena-text-embeddings/target/classes" org.apache.jena.fuseki.main.cmds.FusekiServerCmd --port {{.FUSEKI_PORT}} --config config.ttl > fuseki.log 2>&1 &
      - |
        for i in $(seq 1 30); do
          if curl -sf "{{.SERVER_URL}}/$/ping" >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        echo "Fuseki did not start; see demo/fuseki.log"
        exit 1
