version: '3'

vars:
  VERSION: 6.1.0-SNAPSHOT
  FUSEKI_JAR: ../../jena-fuseki2/jena-fuseki-server/target/jena-fuseki-server-{{.VERSION}}.jar
  # 3031, not 3030: the other demos in this repo use 3030, so this one can run
  # alongside them. Override with FUSEKI_PORT=... if you want the usual port.
  FUSEKI_PORT: '{{.FUSEKI_PORT | default "3031"}}'
  FULL_PORT: '{{.FULL_PORT | default "3032"}}'
  APP_PORT: '{{.APP_PORT | default "8010"}}'
  SERVER_URL: http://localhost:{{.FUSEKI_PORT}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the Fuseki server JAR (includes jena-text)
    dir: ../..
    cmds:
      - mvn install -pl jena-fuseki2/jena-fuseki-server -am -DskipTests

  # ── Data ─────────────────────────────────────────────────

  extract:
    desc: "Re-extract measurements from the full GSWA dump (usage: task extract ROWS=5000 SRC=/path/dump.csv)"
    vars:
      ROWS: '{{.ROWS | default "1000"}}'
      SRC: '{{.SRC | default "/home/david/gswa-pg/dumps/dh_summary_measurements.csv"}}'
    cmds:
      - python3 tools/extract-measurements.py {{.SRC}} data/measurements.csv {{.ROWS}}
      - python3 tools/make-collars.py data/measurements.csv data/collars.ttl

  check-sorted:
    desc: Verify the extract is sorted the way the streaming merge needs (lexically, LC_ALL=C)
    cmds:
      - python3 tools/check-sorted.py data/measurements.csv

  # ── Index ────────────────────────────────────────────────

  load:
    desc: Load the collars into TDB2 (bypasses the change listener, as tdb2.tdbloader does)
    cmds:
      # Taxonomy goes too: facet ordinals left over from a previous build would no
      # longer line up with the freshly written documents.
      - rm -rf DB Lucene Taxonomy
      - java -cp {{.FUSEKI_JAR}} tdb2.tdbloader --loc=DB data/collars.ttl

  index:
    desc: Bulk-index collars + external measurements into Lucene
    cmds:
      - java -cp {{.FUSEKI_JAR}} org.apache.jena.query.text.cmd.shacltextindexer --desc=config.ttl

  rebuild:
    desc: Wipe and rebuild everything (load + index)
    cmds:
      - task: load
      - task: index

  # ── Full scale ───────────────────────────────────────────
  #
  # The whole dump: ~2.47 M collars x ~12 measurements = ~29.7 M child documents,
  # ~32 M Lucene docs in one index. Separate directories throughout, so a full
  # build never disturbs the small demo.

  link-full:
    desc: "Point the full config at the dump (usage: task link-full SRC=/path/dump.csv)"
    vars:
      SRC: '{{.SRC | default "/home/david/gswa-pg/dumps/dh_summary_measurements.csv"}}'
    cmds:
      # A symlink, not a copy: 700 MB, and it keeps machine-specific paths out of
      # the committed config.
      - 'test -r "{{.SRC}}" || { echo "Not readable: {{.SRC}}"; exit 1; }'
      - ln -sfn "{{.SRC}}" data/full-measurements.csv
      - echo "data/full-measurements.csv -> {{.SRC}}"

  check-sorted-full:
    desc: Verify the full dump is lexically ordered (a few minutes; 29.7 M rows)
    cmds:
      - python3 tools/check-sorted.py data/full-measurements.csv

  collars-full:
    desc: Generate synthetic collars for every collar_id in the full dump
    cmds:
      - python3 tools/make-collars.py data/full-measurements.csv data/collars-full.ttl

  load-full:
    desc: Load the full collar set into TDB2
    cmds:
      - rm -rf DB-full Lucene-full Taxonomy-full
      - java -Xmx8g -cp {{.FUSEKI_JAR}} tdb2.tdbloader --loc=DB-full data/collars-full.ttl

  index-full:
    desc: Bulk-index the full collar set + 29.7 M measurements
    cmds:
      # Heap matters here: discovery materialises every work item before sorting
      # them by entity IRI, which the streaming merge requires.
      - java -Xmx8g -cp {{.FUSEKI_JAR}} org.apache.jena.query.text.cmd.shacltextindexer --desc=config-full.ttl

  reindex-full:
    desc: Full-scale build from scratch (link + collars + load + index)
    cmds:
      - task: link-full
      - task: collars-full
      - task: load-full
      - task: index-full

  serve-full:
    desc: Start Fuseki on the full-scale index (port 3032)
    cmds:
      - java -Xmx4g -jar {{.FUSEKI_JAR}} --config=config-full.ttl --port={{.FULL_PORT}}

  smoke-full:
    desc: Run the demo queries against the full-scale server
    cmds:
      - ./tools/smoke.sh http://localhost:{{.FULL_PORT}}

  size-full:
    desc: On-disk size of the full-scale index, broken down by what the bytes are
    cmds:
      - ./tools/index-size.sh Lucene-full

  index-graphonly:
    desc: Build the A/B twin — same collars, no external content — into Lucene-graphonly
    cmds:
      - rm -rf Lucene-graphonly
      - java -Xmx8g -cp {{.FUSEKI_JAR}} org.apache.jena.query.text.cmd.shacltextindexer --desc=config-full-graphonly.ttl

  measure-split:
    desc: How much of the index is external content? Builds the A/B twin and differences it
    cmds:
      - task: index-graphonly
      - ./tools/index-size.sh Lucene-full Lucene-graphonly

  clean-full:
    desc: Remove the full-scale database, index, taxonomy and generated collars
    cmds:
      - rm -rf DB-full Lucene-full Taxonomy-full Lucene-graphonly data/collars-full.ttl
      - echo "Removed full-scale artifacts (the symlink and the dump are left alone)"

  # ── Serve ────────────────────────────────────────────────

  serve:
    desc: Start Fuseki on the built index
    cmds:
      - java -jar {{.FUSEKI_JAR}} --config=config.ttl --port={{.FUSEKI_PORT}}

  app:
    desc: Serve the standalone demo page
    cmds:
      - echo "Demo page at http://localhost:{{.APP_PORT}}/index.html"
      - python3 -m http.server {{.APP_PORT}} --directory app

  stop:
    desc: Stop the running Fuseki server
    cmds:
      - pkill -f "jena-fuseki-server" && echo "Server stopped" || echo "No server running"

  clean:
    desc: Remove the TDB2 database, Lucene index and facet taxonomy
    cmds:
      - rm -rf DB Lucene Taxonomy
      - echo "Removed DB/, Lucene/ and Taxonomy/"

  # ── Checks ───────────────────────────────────────────────

  smoke:
    desc: Run the demo queries against a running server and print the results
    cmds:
      - ./tools/smoke.sh {{.SERVER_URL}}
