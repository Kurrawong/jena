##
## Deny-by-default for Fuseki's admin space, for a demo served on a public URL.
##
## Fuseki's bundled default is "/$/** = localhostFilter", which compares the socket's
## remote address. That is sound when nothing sits in front of the server and worthless
## when something does: a reverse proxy connects from localhost, so every request it
## forwards passes the filter no matter where the browser was. Dataset creation and
## deletion, backup and compaction are all in that space.
##
## authcBasic with no [users] cannot be satisfied by anyone, from anywhere, proxied or
## not. The paths the demo actually needs are opened by name:
##
##   /$/ping    — container health check
##   /$/config  — the app's configuration view; GET-only in ActionConfig, and it serves
##                the same config.ttl that is public in the repository
##   /$/server  — how the Fuseki UI lists the dataset. Read-only, and it reports the
##                names and endpoints this demo publishes anyway
##   /$/stats   — the UI's statistics page. Counters, no content
##
## Everything the UI uses to *change* anything is under /$/datasets — create, delete,
## backup — and stays shut. Those pages will report an error to anyone who tries, which
## is the correct answer for a public read-only demo.
##
## Read-only demo, so the dataset itself stays anon. There is no update or gsp-rw
## endpoint to protect — see config.ttl.

[main]
ssl.enabled = false
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher

[users]
## Deliberately empty: authcBasic below must be unsatisfiable.

[roles]

[urls]
/$/ping      = anon
/$/config    = anon
/$/config/** = anon
/$/server    = anon
/$/stats     = anon
/$/stats/**  = anon
/$/**        = authcBasic
/**          = anon
