version: '3'

vars:
  # Read from pom.xml rather than hardcoded. This was pinned at 6.1.0-SNAPSHOT
  # while the pom had moved to 6.2.0-SNAPSHOT, so local builds and CI tagged
  # the same source differently. Deriving it cannot drift.
  VERSION:
    sh: grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/'
  # Short commit SHA, matching the immutable tag CI publishes (sha-<short>).
  # Pinned to 7 characters because that is what docker/metadata-action's
  # `type=sha` emits; bare `--short` lets git choose a longer prefix in a repo
  # this size, which would not match the published tag.
  GIT_SHA:
    sh: git rev-parse --short=7 HEAD 2>/dev/null || echo unknown
  RUNTIME_IMAGE_NAME: '{{.RUNTIME_IMAGE_NAME | default "fuseki-lucene-shacl"}}'
  IMAGE_NAME: '{{.IMAGE_NAME | default "fuseki-lucene-shacl-loader"}}'
  # The demo image: the runtime plus the mining dataset, its configuration and the
  # browser app, all served from one process with nothing on disk. CI publishes it on
  # every push to main, so a deployment tracking :latest redeploys itself.
  DEMO_IMAGE_NAME: '{{.DEMO_IMAGE_NAME | default "fuseki-lucene-shacl-demo"}}'
  DEMO_PORT: '{{.DEMO_PORT | default "3030"}}'
  # Applied by demo-run and matched by demo-stop. A run-time label, not an image LABEL:
  # it survives a rebuild reassigning the tag, and the Dockerfile deliberately carries
  # no LABEL of its own (CI applies the OCI set).
  DEMO_LABEL: 'ai.kurrawong.jena.demo.port'
  IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
  # Must be lowercase: Docker repository names reject uppercase, so "Kurrawong"
  # cannot be used verbatim.
  GHCR_OWNER: '{{.GHCR_OWNER | default "kurrawong"}}'
  # Vulnerability scanning (trivy). TRIVY can point at an alternate binary.
  TRIVY: '{{.TRIVY | default "trivy"}}'
  TRIVY_MIN_VERSION: '0.69.3'
  SCAN_SEVERITY: '{{.SCAN_SEVERITY | default "HIGH,CRITICAL"}}'
  SCAN_REPORT_DIR: '{{.SCAN_REPORT_DIR | default "build-files/docker/scan-reports"}}'
  # Multi-arch image publishing (buildx). Registry pushes target all PLATFORMS.
  PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
  # ACR serves amd64 servers only (no Mac/arm64 consumers), so default to amd64.
  ACR_PLATFORMS: '{{.ACR_PLATFORMS | default "linux/amd64"}}'
  BUILDX_BUILDER: '{{.BUILDX_BUILDER | default "multiarch-builder"}}'

tasks:
  _buildx-builder:
    internal: true
    cmds:
      - docker buildx inspect {{.BUILDX_BUILDER}} >/dev/null 2>&1 || docker buildx create --name {{.BUILDX_BUILDER}} --driver docker-container --bootstrap

  runtime-build:
    desc: Build the clean runtime Fuseki image from the repo root
    cmds:
      - docker build --target runtime -f build-files/docker/Dockerfile -t {{.RUNTIME_IMAGE_NAME}}:{{.IMAGE_TAG}} .

  runtime-ghcr-push:
    desc: Build and push the multi-arch runtime Fuseki image to GitHub CR
    deps: [_buildx-builder]
    cmds:
      - gh auth token | docker login ghcr.io -u {{.GHCR_OWNER}} --password-stdin
      - docker buildx build --builder {{.BUILDX_BUILDER}} --platform {{.PLATFORMS}} --target runtime -f build-files/docker/Dockerfile -t ghcr.io/{{.GHCR_OWNER}}/{{.RUNTIME_IMAGE_NAME}}:{{.IMAGE_TAG}} --push .

  runtime-acr-push:
    desc: "Build and push the multi-arch runtime image to ACR (usage: task runtime-acr-push ACR_NAME=gswadevacr)"
    requires:
      vars: [ACR_NAME]
    deps: [_buildx-builder]
    cmds:
      - az account show > /dev/null 2>&1 || az login
      - az acr login --name {{.ACR_NAME}}
      - docker buildx build --builder {{.BUILDX_BUILDER}} --platform {{.ACR_PLATFORMS}} --target runtime -f build-files/docker/Dockerfile -t {{.ACR_NAME}}.azurecr.io/{{.RUNTIME_IMAGE_NAME}}:{{.IMAGE_TAG}} -t {{.ACR_NAME}}.azurecr.io/{{.RUNTIME_IMAGE_NAME}}:latest --push .

  loader-build:
    desc: Build the text-only SHACL indexer image from the repo root
    cmds:
      - docker build --target loader -f build-files/docker/Dockerfile -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} .

  loader-ghcr-push:
    desc: Build and push the multi-arch text-only SHACL indexer image to GitHub CR
    deps: [_buildx-builder]
    cmds:
      - gh auth token | docker login ghcr.io -u {{.GHCR_OWNER}} --password-stdin
      - docker buildx build --builder {{.BUILDX_BUILDER}} --platform {{.PLATFORMS}} --target loader -f build-files/docker/Dockerfile -t ghcr.io/{{.GHCR_OWNER}}/{{.IMAGE_NAME}}:{{.IMAGE_TAG}} --push .

  demo-build:
    desc: Build the self-contained demo image (in-memory data and index, app included)
    cmds:
      - docker build --target demo -f build-files/docker/Dockerfile -t {{.DEMO_IMAGE_NAME}}:{{.IMAGE_TAG}} .

  demo-run:
    desc: "Run the demo image locally on http://localhost:3030 (foreground, no volumes)"
    cmds:
      # Free the port first. Rebuild-and-rerun is the whole loop for an image with no
      # state, and without this every second run dies on "port is already allocated"
      # from the container the first one left behind.
      - task: demo-stop
      # Named for the port, so a second run on a different DEMO_PORT is a second
      # container rather than a name clash.
      #
      # The label is what demo-stop actually finds it by, and it is set here at run time
      # rather than baked into the image with LABEL. A --filter ancestor= cannot do this
      # job: it resolves the tag to an image ID, so the moment demo-build reassigns
      # :{{.IMAGE_TAG}} to a new image, the container from the previous build stops
      # matching — which is every rebuild-and-rerun, the one loop this has to survive.
      # docker ps then reports that container's image as a bare ID, so matching on the
      # image name fails there too.
      - docker run --rm --name {{.DEMO_IMAGE_NAME}}-{{.DEMO_PORT}} --label {{.DEMO_LABEL}}={{.DEMO_PORT}} -p {{.DEMO_PORT}}:3030 {{.DEMO_IMAGE_NAME}}:{{.IMAGE_TAG}}

  demo-stop:
    desc: Stop a demo container running on DEMO_PORT, leaving anything else on that port alone
    cmds:
      # Matched by label and name — both set by demo-run — never by port alone.
      # DEMO_PORT defaults to 3030, which is exactly where an unrelated Fuseki is a
      # normal thing to have running, and "free the port" must never come to mean
      # "stop whatever is using it".
      #
      # A container this task did not start is therefore reported rather than stopped:
      # that is the honest answer, and it explains the "port is already allocated"
      # failure before docker gets to produce it.
      - |
        ids="$(docker ps -q --filter label={{.DEMO_LABEL}}={{.DEMO_PORT}})
        $(docker ps -q --filter name=^/{{.DEMO_IMAGE_NAME}}-{{.DEMO_PORT}}$)"
        ids="$(echo $ids | tr -s ' \n' ' ' | tr ' ' '\n' | sort -u | tr '\n' ' ')"
        if [ -n "$(echo $ids | tr -d ' ')" ]; then
          echo "Stopping demo container(s) on port {{.DEMO_PORT}}: $ids"
          docker stop $ids > /dev/null
        else
          echo "No demo container of ours running on port {{.DEMO_PORT}}"
        fi
        other="$(docker ps -q --filter publish={{.DEMO_PORT}})"
        if [ -n "$other" ]; then
          echo "Port {{.DEMO_PORT}} is still held by a container this task did not start:"
          docker ps --filter publish={{.DEMO_PORT}} --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Image{{"}}"}}'
          echo "Stop it yourself, or run with a different DEMO_PORT."
        fi

  loader-acr-push:
    desc: "Build and push the multi-arch text-only SHACL indexer image to ACR (usage: task loader-acr-push ACR_NAME=gswadevacr)"
    requires:
      vars: [ACR_NAME]
    deps: [_buildx-builder]
    cmds:
      - az account show > /dev/null 2>&1 || az login
      - az acr login --name {{.ACR_NAME}}
      - docker buildx build --builder {{.BUILDX_BUILDER}} --platform {{.ACR_PLATFORMS}} --target loader -f build-files/docker/Dockerfile -t {{.ACR_NAME}}.azurecr.io/{{.IMAGE_NAME}}:{{.IMAGE_TAG}} -t {{.ACR_NAME}}.azurecr.io/{{.IMAGE_NAME}}:latest --push .

  push_gswa:
    desc: Push runtime (as rdf-delta-server) and the loader to the GSWA ACR (gswareg.azurecr.io) with :IMAGE_TAG and :latest
    cmds:
      # On gswareg both images follow the GSWA naming convention —
      # rdf-delta-server and fuseki-loader — not fuseki-lucene-shacl and
      # fuseki-lucene-shacl-loader, which GHCR and gswadevacr use.
      - task: runtime-acr-push
        vars:
          ACR_NAME: gswareg
          RUNTIME_IMAGE_NAME: rdf-delta-server
      - task: loader-acr-push
        vars:
          ACR_NAME: gswareg
          IMAGE_NAME: fuseki-loader

  # ── Vulnerability scanning ──────────────────────────────

  scan-check-trivy:
    desc: Verify trivy is installed and recent enough to scan the UBI/RHEL 10 base
    silent: true
    cmds:
      - |
        if ! command -v {{.TRIVY}} >/dev/null 2>&1; then
          echo "ERROR: trivy not found (looked for '{{.TRIVY}}')."
          echo "Install without admin rights:"
          echo "  curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b \"\$HOME/.local/bin\" v{{.TRIVY_MIN_VERSION}}"
          echo "  (then ensure \$HOME/.local/bin is on PATH)   or:   brew install trivy"
          exit 1
        fi
        installed="$({{.TRIVY}} --version | awk '/^Version:/ {print $2}')"
        min="{{.TRIVY_MIN_VERSION}}"
        if [ "$(printf '%s\n%s\n' "$min" "$installed" | sort -V | head -n1)" != "$min" ]; then
          echo "ERROR: trivy $installed is too old; need >= $min."
          echo "Older trivy cannot scan the UBI/RHEL 10 OS layer (trivy-db issue #435)."
          echo "Upgrade:  brew upgrade trivy   (or re-run the install.sh one-liner from scan-check-trivy)"
          exit 1
        fi
        echo "trivy $installed OK (>= $min)"

  scan-image:
    desc: 'Scan one local image for vulns (usage: task scan-image SCAN_IMAGE=fuseki-loader:6.1.0-SNAPSHOT)'
    deps: [scan-check-trivy]
    requires:
      vars: [SCAN_IMAGE]
    cmds:
      - mkdir -p {{.SCAN_REPORT_DIR}}
      - |
        if ! docker image inspect {{.SCAN_IMAGE}} >/dev/null 2>&1; then
          echo "ERROR: image '{{.SCAN_IMAGE}}' not found locally."
          echo "Build it first, e.g.:  task loader-build   |   task runtime-build"
          exit 1
        fi
      - |
        report="{{.SCAN_REPORT_DIR}}/$(echo '{{.SCAN_IMAGE}}' | tr '/:' '__').json"
        echo "=== Scanning {{.SCAN_IMAGE}} (severity {{.SCAN_SEVERITY}}) ==="
        {{.TRIVY}} image --quiet --scanners vuln --severity {{.SCAN_SEVERITY}} \
          --no-progress --format json --output "$report" {{.SCAN_IMAGE}}
        {{.TRIVY}} convert --format table "$report"
        echo ""
        echo "JSON report: $report"

  scan:
    desc: Scan both Fuseki images (runtime + loader) for HIGH/CRITICAL vulnerabilities
    cmds:
      - task: scan-image
        vars:
          SCAN_IMAGE: '{{.RUNTIME_IMAGE_NAME}}:{{.IMAGE_TAG}}'
      - task: scan-image
        vars:
          SCAN_IMAGE: '{{.IMAGE_NAME}}:{{.IMAGE_TAG}}'
