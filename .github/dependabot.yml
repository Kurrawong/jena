##
## Scope: this fork only tracks dependencies it actually owns.
##
## The `maven` and `npm` ecosystems are deliberately NOT configured here.
## Apache Jena upstream runs Dependabot over the same dependency tree
## (~47% of upstream commits are dependency bumps), so configuring them
## here duplicates that work and turns every root-pom version property
## into a conflict on the next upstream sync. Those versions arrive via
## the scheduled upstream merge instead -- see
## .github/workflows/upstream-sync.yml
##
## Dependabot SECURITY updates are unaffected by this file: they are a
## separate repository-level feature and still raise PRs for CVEs in the
## full Maven/npm tree between syncs.
##

version: 2
updates:

  ## Our workflows: docker.yml, scan-published.yml, pr.yml, upstream-sync.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
      day: "tuesday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  ## Our Fuseki images (Dockerfile.runtime, Dockerfile.loader), which are
  ## the ones scan-published.yml runs trivy against.
  - package-ecosystem: "docker"
    directory: "/build-files/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
