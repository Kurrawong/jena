name: Build and push Docker images

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      ## Documentation and agent config cannot change build or image output.
      ## Deliberately NOT ignored: demo/** (TestDemoDataParsing parses those
      ## files), build-files/**, Taskfile.yml, and .github/** itself.
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
  push:
    branches:
      - main
    paths-ignore:
      ## Documentation and agent config cannot change build or image output.
      ## Deliberately NOT ignored: demo/** (TestDemoDataParsing parses those
      ## files), build-files/**, Taskfile.yml, and .github/** itself.
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

## A docs commit used to leave earlier image builds running alongside the new
## one; superseded runs are now cancelled, as they already are for pr.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ## Owner is a lowercase literal, not ${{ github.repository_owner }}. That
  ## expression returns the owner with its original casing — "Kurrawong" — and
  ## Docker repository names must be lowercase, so buildx rejected the tag
  ## before reaching the registry and every push since the repo moved failed
  ## with: invalid tag "ghcr.io/Kurrawong/...": repository name must be lowercase
  FUSEKI_IMAGE: ghcr.io/kurrawong/fuseki-lucene-shacl
  LOADER_IMAGE: ghcr.io/kurrawong/fuseki-lucene-shacl-loader
  DEMO_IMAGE: ghcr.io/kurrawong/fuseki-lucene-shacl-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ## The pom version is upstream Jena's, not a version of this fork — the
      ## fork tracks apache/jena@main, so two different commits here can both
      ## read 6.2.0-SNAPSHOT and mean very different things. It is therefore
      ## recorded as an image *label* rather than used as a tag. See the tag
      ## scheme in the metadata steps below.
      - name: Extract upstream Jena version from pom.xml
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      ## Tag scheme, for both images:
      ##   sha-<short>  immutable, exact, one per commit — the thing to pin and
      ##                roll back to
      ##   latest       floating, default branch only
      ##
      ## Provenance that used to be crammed into the tag lives in OCI labels
      ## instead (revision, version, created, source), so `docker inspect` or
      ## the GHCR UI answers "which commit, which Jena" without encoding it in
      ## a tag that cannot be trusted to be unique.
      - name: Docker metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FUSEKI_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Docker metadata (demo)
        id: meta-demo
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DEMO_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Docker metadata (loader)
        id: meta-loader
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.LOADER_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Both images come from one Dockerfile via --target, sharing the `builder`
      # stage. The first build below populates that stage in the gha cache; the
      # remaining three hit it, so the Maven reactor runs once per commit rather
      # than once per image. The builder is pinned to linux/amd64, so the
      # multi-arch push steps reuse it too.

      # ─── fuseki-lucene-shacl: build amd64 (load), scan, push multi-arch on main ───────

      - name: Build fuseki-lucene-shacl (amd64, load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: fuseki-lucene-shacl:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan fuseki-lucene-shacl (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fuseki-lucene-shacl:scan
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false

      - name: Push fuseki-lucene-shacl (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          annotations: ${{ steps.meta-runtime.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── fuseki-lucene-shacl-loader: build amd64 (load), smoke-test, scan, push multi-arch ──

      - name: Build fuseki-lucene-shacl-loader (amd64, load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: loader
          platforms: linux/amd64
          load: true
          tags: fuseki-lucene-shacl-loader:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test fuseki-lucene-shacl-loader with tdb2.xloader
        run: |
          mkdir -p "$RUNNER_TEMP/xloader-db" "$RUNNER_TEMP/xloader-tmp"
          docker run --rm \
            -e MODE=tdb2.xloader \
            -e NO_STATS=true \
            -v "$PWD/build-files/docker/test-xloader/config.ttl:/config.ttl:ro" \
            -v "$PWD/build-files/docker/test-xloader/data:/rdf:ro" \
            -v "$RUNNER_TEMP/xloader-db:/data/DB" \
            -v "$RUNNER_TEMP/xloader-tmp:/tmp" \
            fuseki-lucene-shacl-loader:scan

      - name: Verify xloader smoke-test dataset
        run: |
          actual="$({
            printf '%s\n' 'SELECT (COUNT(DISTINCT ?s) AS ?total) WHERE { ?s ?p ?o }'
          } | docker run --rm -i \
                -v "$RUNNER_TEMP/xloader-db:/data/DB" \
                --entrypoint java \
                fuseki-lucene-shacl-loader:scan \
                -cp /fuseki/jena-fuseki-server.jar tdb2.tdbquery --loc /data/DB/ds --query=- --results=csv)"
          echo "$actual"
          test "$(printf '%s' "$actual" | tail -n 1 | tr -d '\r')" = "4"

      - name: Scan fuseki-lucene-shacl-loader (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fuseki-lucene-shacl-loader:scan
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false

      - name: Push fuseki-lucene-shacl-loader (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: loader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-loader.outputs.tags }}
          labels: ${{ steps.meta-loader.outputs.labels }}
          annotations: ${{ steps.meta-loader.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── fuseki-lucene-shacl-demo: build amd64 (load), smoke-test, push multi-arch ──
      #
      # Not scanned. It is `FROM runtime` with Turtle, JSON and static assets copied
      # on top — no packages, no jars, nothing trivy could find that the runtime scan
      # above did not already cover on the same layers.

      - name: Build fuseki-lucene-shacl-demo (amd64, load for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: demo
          platforms: linux/amd64
          load: true
          tags: fuseki-lucene-shacl-demo:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ## The demo's whole claim is that one container, started with no arguments and no
      ## volumes, comes up serving a populated index and the app that reads it. Each
      ## assertion below is a way that has silently failed in development: an index
      ## that builds but stays empty, an app whose examples list 404s because a symlink
      ## was copied, an admin space left reachable.
      - name: Smoke-test fuseki-lucene-shacl-demo
        run: |
          set -euo pipefail
          docker run -d --name demo -p 3030:3030 fuseki-lucene-shacl-demo:smoke

          for i in $(seq 1 60); do
            if curl -sf http://localhost:3030/\$/ping >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3030/\$/ping >/dev/null

          echo "--- the index has content ---"
          hits=$(curl -sf -X POST http://localhost:3030/mining/query \
            -H 'Content-Type: application/sparql-query' \
            -H 'Accept: text/csv' \
            --data-binary 'PREFIX luc: <urn:jena:lucene:index#>
              SELECT (COUNT(*) AS ?n) WHERE {
                (?hit ?entity ?score) luc:query ("default" "default" "copper" "" "" 1000 0)
              }' | tail -n 1 | tr -d '\r')
          echo "copper hits: $hits"
          test "$hits" -gt 0

          echo "--- facets, which need the taxonomy the in-memory index builds ---"
          ## luc:facet takes exactly seven objects, and facetFields is a JSON array in a
          ## string literal, not an RDF list. Written as """...""" because the
          ## surrounding shell string is already single-quoted.
          facets=$(curl -sf -X POST http://localhost:3030/mining/query \
            -H 'Content-Type: application/sparql-query' \
            -H 'Accept: text/csv' \
            --data-binary 'PREFIX luc: <urn:jena:lucene:index#>
              SELECT (COUNT(*) AS ?n) WHERE {
                (?field ?value ?low ?high ?count) luc:facet
                  ("default" "default" "*" """["urn:jena:lucene:field#state"]""" "" 20 0)
              }' | tail -n 1 | tr -d '\r')
          echo "state facet values: $facets"
          test "$facets" -gt 0

          echo "--- the Fuseki UI is at the root ---"
          ## It has to be: the UI prefixes every API call with the path it was served
          ## from, so anywhere else it asks for /somewhere/$/server and gets a 404.
          curl -sf http://localhost:3030/ | grep -q "Apache Jena Fuseki"

          echo "--- the search app is at /demo, served from the same origin ---"
          curl -sf http://localhost:3030/demo/ | grep -q "Search Tester"
          curl -sf http://localhost:3030/demo/app.js >/dev/null
          curl -sf http://localhost:3030/demo/tests.json | head -c 1 | grep -q '\['
          ## Not `fusekiBase: ''` — app.js reads the base with `||`, so an empty string
          ## is discarded for its hardcoded localhost:3030 default and the app talks to
          ## whatever else is on that port. The deployed config takes the origin from
          ## the browser instead, which is also what lets it work from /demo rather than
          ## from the root.
          curl -sf http://localhost:3030/demo/app-config.js | grep -q "fusekiBase: window.location.origin"

          echo "--- read-only, and the admin space is closed apart from what the UI reads ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:3030/mining/update --data-urlencode \
            'update=INSERT DATA { <urn:a> <urn:b> <urn:c> }')" = "405"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:3030/$/config')" = "200"
          ## Opened for the UI's dataset list and statistics page: read-only.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:3030/$/server')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:3030/$/stats')" = "200"
          ## Everything that changes anything stays shut, including for the UI.
          for path in '$/datasets' '$/backup/mining' '$/compact/mining'; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3030/$path")"
            test "$code" = "401" || { echo "/$path returned $code, expected 401"; exit 1; }
          done

      ## Every example the app offers, replayed against that container: parameters
      ## through the URL and back, then the query itself. curl cannot see this class of
      ## bug — a filter lost between the address bar and the query still returns results,
      ## just the wrong ones, and the page reads like a working search. Two shipped that
      ## way before this existed.
      - name: Replay the demo app's examples
        run: FUSEKI_PORT=3030 node --test demo/testing/check-examples.mjs

      - name: Stop the demo container
        if: always()
        run: docker rm -f demo || true

      - name: Push fuseki-lucene-shacl-demo (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-demo.outputs.tags }}
          labels: ${{ steps.meta-demo.outputs.labels }}
          annotations: ${{ steps.meta-demo.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
