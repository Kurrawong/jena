name: Build and push Docker images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FUSEKI_IMAGE: ghcr.io/${{ github.repository_owner }}/fuseki-ai
  LOADER_IMAGE: ghcr.io/${{ github.repository_owner }}/fuseki-loader

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ─── fuseki-ai: build amd64 (load), scan, push multi-arch on main ───────

      - name: Build fuseki-ai (amd64, load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-files/docker/Dockerfile.runtime
          platforms: linux/amd64
          load: true
          tags: fuseki-ai:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan fuseki-ai (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fuseki-ai:scan
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false

      - name: Push fuseki-ai (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-files/docker/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FUSEKI_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FUSEKI_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── fuseki-loader: build amd64 (load), smoke-test, scan, push multi-arch ──

      - name: Build fuseki-loader (amd64, load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-files/docker/Dockerfile.loader
          platforms: linux/amd64
          load: true
          tags: fuseki-loader:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test fuseki-loader with tdb2.xloader
        run: |
          mkdir -p "$RUNNER_TEMP/xloader-db" "$RUNNER_TEMP/xloader-tmp"
          docker run --rm \
            -e MODE=tdb2.xloader \
            -e NO_STATS=true \
            -v "$PWD/build-files/docker/test-xloader/config.ttl:/config.ttl:ro" \
            -v "$PWD/build-files/docker/test-xloader/data:/rdf:ro" \
            -v "$RUNNER_TEMP/xloader-db:/data/DB" \
            -v "$RUNNER_TEMP/xloader-tmp:/tmp" \
            fuseki-loader:scan

      - name: Verify xloader smoke-test dataset
        run: |
          actual="$({
            printf '%s\n' 'SELECT (COUNT(DISTINCT ?s) AS ?total) WHERE { ?s ?p ?o }'
          } | docker run --rm -i \
                -v "$RUNNER_TEMP/xloader-db:/data/DB" \
                --entrypoint java \
                fuseki-loader:scan \
                -cp /fuseki/jena-fuseki-server.jar tdb2.tdbquery --loc /data/DB/ds --query=- --results=csv)"
          echo "$actual"
          test "$(printf '%s' "$actual" | tail -n 1 | tr -d '\r')" = "4"

      - name: Scan fuseki-loader (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fuseki-loader:scan
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false

      - name: Push fuseki-loader (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-files/docker/Dockerfile.loader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.LOADER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.LOADER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
