name: Build and push Docker images

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      ## Documentation and agent config cannot change build or image output.
      ## Deliberately NOT ignored: demo/** (TestDemoDataParsing parses those
      ## files), build-files/**, Taskfile.yml, and .github/** itself.
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
  push:
    branches:
      - main
    paths-ignore:
      ## Documentation and agent config cannot change build or image output.
      ## Deliberately NOT ignored: demo/** (TestDemoDataParsing parses those
      ## files), build-files/**, Taskfile.yml, and .github/** itself.
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

## A docs commit used to leave earlier image builds running alongside the new
## one; superseded runs are now cancelled, as they already are for pr.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ## Owner is a lowercase literal, not ${{ github.repository_owner }}. That
  ## expression returns the owner with its original casing — "Kurrawong" — and
  ## Docker repository names must be lowercase, so buildx rejected the tag
  ## before reaching the registry and every push since the repo moved failed
  ## with: invalid tag "ghcr.io/Kurrawong/...": repository name must be lowercase
  FUSEKI_IMAGE: ghcr.io/kurrawong/fuseki-lucene-shacl
  LOADER_IMAGE: ghcr.io/kurrawong/fuseki-lucene-shacl-loader

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ## The pom version is upstream Jena's, not a version of this fork — the
      ## fork tracks apache/jena@main, so two different commits here can both
      ## read 6.2.0-SNAPSHOT and mean very different things. It is therefore
      ## recorded as an image *label* rather than used as a tag. See the tag
      ## scheme in the metadata steps below.
      - name: Extract upstream Jena version from pom.xml
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      ## Tag scheme, for both images:
      ##   sha-<short>  immutable, exact, one per commit — the thing to pin and
      ##                roll back to
      ##   latest       floating, default branch only
      ##
      ## Provenance that used to be crammed into the tag lives in OCI labels
      ## instead (revision, version, created, source), so `docker inspect` or
      ## the GHCR UI answers "which commit, which Jena" without encoding it in
      ## a tag that cannot be trusted to be unique.
      - name: Docker metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FUSEKI_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Docker metadata (loader)
        id: meta-loader
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.LOADER_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Both images come from one Dockerfile via --target, sharing the `builder`
      # stage. The first build below populates that stage in the gha cache; the
      # remaining three hit it, so the Maven reactor runs once per commit rather
      # than once per image. The builder is pinned to linux/amd64, so the
      # multi-arch push steps reuse it too.

      # ─── fuseki-lucene-shacl: build amd64 (load), scan, push multi-arch on main ───────

      - name: Build fuseki-lucene-shacl (amd64, load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: fuseki-lucene-shacl:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan fuseki-lucene-shacl (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fuseki-lucene-shacl:scan
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false

      - name: Push fuseki-lucene-shacl (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          annotations: ${{ steps.meta-runtime.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── fuseki-lucene-shacl-loader: build amd64 (load), smoke-test, scan, push multi-arch ──

      - name: Build fuseki-lucene-shacl-loader (amd64, load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: loader
          platforms: linux/amd64
          load: true
          tags: fuseki-lucene-shacl-loader:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test fuseki-lucene-shacl-loader with tdb2.xloader
        run: |
          mkdir -p "$RUNNER_TEMP/xloader-db" "$RUNNER_TEMP/xloader-tmp"
          docker run --rm \
            -e MODE=tdb2.xloader \
            -e NO_STATS=true \
            -v "$PWD/build-files/docker/test-xloader/config.ttl:/config.ttl:ro" \
            -v "$PWD/build-files/docker/test-xloader/data:/rdf:ro" \
            -v "$RUNNER_TEMP/xloader-db:/data/DB" \
            -v "$RUNNER_TEMP/xloader-tmp:/tmp" \
            fuseki-lucene-shacl-loader:scan

      - name: Verify xloader smoke-test dataset
        run: |
          actual="$({
            printf '%s\n' 'SELECT (COUNT(DISTINCT ?s) AS ?total) WHERE { ?s ?p ?o }'
          } | docker run --rm -i \
                -v "$RUNNER_TEMP/xloader-db:/data/DB" \
                --entrypoint java \
                fuseki-lucene-shacl-loader:scan \
                -cp /fuseki/jena-fuseki-server.jar tdb2.tdbquery --loc /data/DB/ds --query=- --results=csv)"
          echo "$actual"
          test "$(printf '%s' "$actual" | tail -n 1 | tr -d '\r')" = "4"

      - name: Scan fuseki-lucene-shacl-loader (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fuseki-lucene-shacl-loader:scan
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false

      - name: Push fuseki-lucene-shacl-loader (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build-files/docker/Dockerfile
          target: loader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-loader.outputs.tags }}
          labels: ${{ steps.meta-loader.outputs.labels }}
          annotations: ${{ steps.meta-loader.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
